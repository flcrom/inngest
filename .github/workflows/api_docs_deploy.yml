name: API Docs deploy

permissions:
  contents: read

on:
  workflow_run:
    workflows: [API Docs]
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment target"
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

concurrency:
  group: api-docs-deploy-${{ github.event_name == 'workflow_run' && 'production' || inputs.environment }}
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main')
    name: Build and deploy API docs
    runs-on: ubuntu-latest
    env:
      DEPLOY_ENVIRONMENT: ${{ github.event_name == 'workflow_run' && 'production' || inputs.environment }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          version: "10.18.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: docs/api-docs/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: docs/api-docs
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install -g vercel

      - name: Pull Vercel project settings
        working-directory: docs/api-docs
        run: vercel pull --yes --environment="${DEPLOY_ENVIRONMENT}"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (preview)
        if: env.DEPLOY_ENVIRONMENT == 'preview'
        working-directory: docs/api-docs
        run: vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build (production)
        if: env.DEPLOY_ENVIRONMENT == 'production'
        working-directory: docs/api-docs
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to preview
        if: env.DEPLOY_ENVIRONMENT == 'preview'
        working-directory: docs/api-docs
        run: vercel deploy --prebuilt
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        if: env.DEPLOY_ENVIRONMENT == 'production'
        working-directory: docs/api-docs
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
